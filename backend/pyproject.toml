[project]
name = "company-memory-backend"
version = "0.1.0"
description = "Company Memory API and integration modules"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1.0", "pytest>=8,<10", "ruff>=0.11,<1.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
