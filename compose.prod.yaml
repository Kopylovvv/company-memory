name: company-memory

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-company_memory}
      POSTGRES_USER: ${POSTGRES_USER:-company_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-company_memory}
      POSTGRES_USER: ${POSTGRES_USER:-company_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?Set MAX_BOT_TOKEN in the production env file}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
    expose:
      - "8000"
    networks:
      - private
      - public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MAX bot (Issue #5). Same image as `backend`, but a different process: it long-polls
  # MAX and stores messages as draft cases, so it needs the database and outbound
  # internet but publishes no port. Migrations are run by `backend`, hence depends_on.
  # Only ONE poller may consume a bot's updates: never run another `app.bot.polling`
  # (a laptop, a second replica) against the same token, or the two steal messages
  # from each other.
  bot:
    build: ./backend
    restart: unless-stopped
    command: [".venv/bin/python", "-m", "app.bot.polling"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-company_memory}
      POSTGRES_USER: ${POSTGRES_USER:-company_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?Set MAX_BOT_TOKEN in the production env file}
      LLM_API_KEY: ${LLM_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_GPT_MODEL: ${YANDEX_GPT_MODEL:-yandexgpt/latest}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
    networks:
      - private
      - public
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the production env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
    depends_on:
      backend:
        condition: service_healthy

networks:
  private:
    internal: true
  public:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
